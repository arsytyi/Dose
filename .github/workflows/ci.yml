name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      - run: flutter pub get

      - name: Check app version matches pubspec
        run: |
          pub=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          app=$(sed -n "s/^const appVersion = '\(.*\)';/\1/p" lib/version.dart)
          test "$pub" = "$app" || { echo "pubspec $pub != lib/version.dart $app"; exit 1; }

      - name: Check generated code is up to date
        run: |
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n
          git diff --exit-code

      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

      - name: Build APK (GitHub) and app bundle (Google Play)
        env:
          BADY_KEYSTORE_BASE64: ${{ secrets.BADY_KEYSTORE_BASE64 }}
          BADY_KEYSTORE_PASSWORD: ${{ secrets.BADY_KEYSTORE_PASSWORD }}
        # Version code = minutes since 1970, so every newer build (CI or
        # release) is accepted as an update over an older one.
        run: |
          code=$(( $(date +%s) / 60 ))
          flutter build apk --release --flavor github --target-platform android-arm64 --build-number=$code
          flutter build appbundle --release --flavor play --build-number=$code

      - uses: actions/upload-artifact@v4
        with:
          name: dose-apk
          path: build/app/outputs/flutter-apk/app-github-release.apk
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: dose-play-aab
          path: build/app/outputs/bundle/playRelease/app-play-release.aab
          retention-days: 30
