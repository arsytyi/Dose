name: Release

# Push a tag like v0.6.0 (matching lib/version.dart) to publish a signed APK
# on the repository's Releases page, plus the app bundle (.aab) to upload to
# Google Play.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the app version
        run: |
          app=$(sed -n "s/^const appVersion = '\(.*\)';/\1/p" lib/version.dart)
          test "${GITHUB_REF_NAME}" = "v$app" || { echo "tag ${GITHUB_REF_NAME} != v$app"; exit 1; }

      - name: Require the release signing key
        env:
          BADY_KEYSTORE_BASE64: ${{ secrets.BADY_KEYSTORE_BASE64 }}
        run: test -n "$BADY_KEYSTORE_BASE64" || { echo "Signing secrets are missing"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      - run: flutter pub get
      - run: flutter test

      - name: Build APK (GitHub) and app bundle (Google Play)
        env:
          BADY_KEYSTORE_BASE64: ${{ secrets.BADY_KEYSTORE_BASE64 }}
          BADY_KEYSTORE_PASSWORD: ${{ secrets.BADY_KEYSTORE_PASSWORD }}
        run: |
          code=$(( $(date +%s) / 60 ))
          flutter build apk --release --flavor github --target-platform android-arm64 --build-number=$code
          flutter build appbundle --release --flavor play --build-number=$code
          cp build/app/outputs/flutter-apk/app-github-release.apk "dose-${GITHUB_REF_NAME}.apk"
          cp build/app/outputs/bundle/playRelease/app-play-release.aab "dose-${GITHUB_REF_NAME}-play.aab"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dose-${GITHUB_REF_NAME}.apk" "dose-${GITHUB_REF_NAME}-play.aab" \
            --title "Dose ${GITHUB_REF_NAME#v}" --generate-notes
