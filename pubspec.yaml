name: bady
description: "Dose: medication and supplement reminders"
publish_to: 'none'

# Keep in step with lib/version.dart (CI checks). CI sets the build number.
version: 0.13.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.1.0
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  flutter_riverpod: ^3.5.0
  flutter_local_notifications: ^23.0.2
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  intl: ^0.20.3
  shared_preferences: ^2.5.6
  in_app_purchase: ^3.3.1
  in_app_purchase_android: ^0.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.3
  build_runner: ^2.17.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/interactions.json
